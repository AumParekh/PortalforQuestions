name: Build check

on:
  push:
    branches-ignore: [main]
    paths:
      - 'web/**'
      - 'content/**'
      - '.github/workflows/ci.yml'
      - 'web/scripts/**'
      - 'tools/content/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: web
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      # Question bank: structure (keys, option analysis, math delimiters) and every formula renders in KaTeX.
      - name: Question bank checks
        run: |
          python3 tools/content/validate_bank.py
          NODE_PATH=web/node_modules node tools/content/katex_bank.mjs
      # tsc -b with the real package types, then the production bundle
      - name: Build
        working-directory: web
        run: npm run build
      # Opens every screen in Chromium (phone + desktop) and fails on crashes, console errors,
      # failed content requests, empty screens or horizontal overflow at 375px.
      - name: Browser smoke test
        working-directory: web
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          BASE=http://localhost:4173 node scripts/smoke.mjs
