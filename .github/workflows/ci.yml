name: Build check

on:
  push:
    branches-ignore: [main]
    paths:
      - 'web/**'
      - 'content/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: web
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      # tsc -b with the real package types, then the production bundle
      - name: Build
        working-directory: web
        run: npm run build
