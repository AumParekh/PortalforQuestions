name: Deploy portal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'content/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: web
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build
        working-directory: web
        # The Vite content plugin copies ../content/*.json into dist/content with a manifest.
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
